name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Merged version to publish; select its exact commit as the workflow ref'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Verify release identity and main ancestry
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/release.mjs check "$RELEASE_VERSION"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          tag="v$RELEASE_VERSION"
          if git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          fi
      - name: Install and build the verified commit
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          node scripts/release.mjs prepare
          npm run build:lib
          npm run build:themes
      - name: Create immutable tag and publish missing packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if ! git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          node scripts/release.mjs publish
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          fi
          gh label create 'autorelease: tagged' --color 0E8A16 --force
          numbers=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[] | select(.merged_at != null and .base.ref == "main" and (.head.ref | startswith("release-please--branches--main"))) | .number')
          for number in $numbers; do
            gh issue edit "$number" --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'
          done
