name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b packages/galley-editor

      - name: Unit tests
        run: npm run test:coverage

      - name: Themes tests
        run: npm test --workspace @inkyquill/galley-themes

      - name: Prepare package release notes
        run: node scripts/release.mjs prepare

      - name: Library build
        run: npm run build:lib

      - name: Themes build
        run: npm run build:themes

      - name: Release and commit hook tests
        run: |
          npm run test:release
          npm run test:commit-msg
          node scripts/release.mjs check "$(cat version.txt)"

      - name: Package consumer checks
        run: npm run test:package-consumer

      - name: Forbid external-source markers in dist
        run: |
          if grep -rIE '(joplin|@joplin)' packages/galley-editor/dist/ packages/galley-themes/dist/ ; then
            echo "ERROR: external editor source marker leaked into dist/." >&2
            exit 1
          fi
          echo "dist/ is clean."

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: packages/galley-editor/coverage/
          if-no-files-found: ignore

  docs:
    name: Docs and Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Storybook build
        run: npm run build-storybook

      - name: Docs install
        run: npm --prefix docs-site ci --no-audit --no-fund

      - name: Docs build
        env:
          GALLEY_DOCS_SITE: https://inkyquill.github.io
          GALLEY_DOCS_BASE: /galley-editor
        run: npm run docs:build


  interactions:
    name: Interactions (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }} --workers=2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
