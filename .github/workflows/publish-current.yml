name: Publish Current Version

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package.json version
    runs-on: ubuntu-latest
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install --global 'npm@^11.5.1'

      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify
        run: |
          npm run lint
          npx tsc -b packages/galley-editor
          npm run build:themes
          npm run test:coverage
          npm test --workspace @inkyquill/galley-themes
          npm run build:lib
          npm run test:package-consumer
          ./scripts/verify-publish.sh

      # OIDC authenticates npm publish, but not npm dist-tag. Check each package
      # first so a failed second publish can be retried without republishing the first.
      - name: Publish missing packages
        run: |
          version=$(node -p "require('./packages/galley-editor/package.json').version")
          for package in @inkyquill/galley-editor @inkyquill/galley-themes; do
            if npm view "$package@$version" version --json >/dev/null 2>&1; then
              echo "$package@$version is already published"
            else
              npm publish --workspace "$package" --access public
            fi
          done
